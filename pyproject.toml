[build-system]
requires = ["setuptools", "setuptools-scm>8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "edx-rbac"
description = "Library to help managing role based access controls for django apps"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [
    {name = "Open edX Project", email = "oscm@openedx.org"},
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Framework :: Django',
    'Framework :: Django :: 4.2',
    'Framework :: Django :: 5.2',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
]
keywords = [
    "Django",
    "edx",
]

dynamic = ["readme", "version"]

dependencies = [
    "Django",
    "django-crum",
    "django-model-utils",
    "edx-drf-extensions",
    "setuptools",
    "six",
]

[project.urls]
Homepage = "https://github.com/openedx/edx-rbac"
Repository = "https://github.com/openedx/edx-rbac"

[dependency-groups]
test-base = [
    "code-annotations",
    "ddt",
    "edx-django-release-util",
    "pytest-cov",
    "pytest-django",
]
test = [
    {include-group = "test-base"},
    "Django>=5.2,<6.0",
]
django42 = [
    {include-group = "test-base"},
    "Django>=4.2,<4.3",
]
quality = [
    {include-group = "test"},
    "edx-lint",
    "futures==3.1.1",
    "isort",
    "pycodestyle",
    "pydocstyle",
]
doc = [
    {include-group = "test"},
    "build",
    "doc8",
    "Sphinx",
    "sphinx-book-theme",
    "twine",
]
ci = [
    "tox",
    "tox-uv",
]
dev = [
    {include-group = "quality"},
    {include-group = "doc"},
    {include-group = "ci"},
    "diff-cover",
    "edx-i18n-tools",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGELOG.rst"], content-type = "text/x-rst"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["edx_rbac*"]
exclude = ["*tests*"]

[tool.setuptools.package-data]
edx_rbac = ["templates/**"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.semantic_release]
build_command = "pip install build && SETUPTOOLS_SCM_PRETEND_VERSION=$NEW_VERSION python -m build"

[tool.uv]
package = true
default-groups = []
constraint-dependencies = [
    "Django<6.0",
    "elasticsearch<7.14.0",
    "social-auth-app-django<6.0.0",
    "social-auth-core<5.0.0",
    "pip<26.2.1",
    "diff-cover==4.0.0",
]
conflicts = [
    [{ group = "test" }, { group = "django42" }],
    [{ group = "quality" }, { group = "django42" }],
    [{ group = "doc" }, { group = "django42" }],
    [{ group = "dev" }, { group = "django42" }],
]

[tool.edx_lint]
uv_constraints = [
    "diff-cover==4.0.0",
]

[tool.isort]
indent = '    '
line_length = 120
multi_line_output = 3
