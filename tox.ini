[tox]
envlist = py{311,312}-django{42,52},quality
requires =
    tox-uv>=1

[doc8]
max-line-length = 120

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[pydocstyle]
ignore = D101,D200,D203,D204,D205,D212,D215,D400,D401,D404,D405,D406,D407,D408,D409,D410,D411,D412,D413,D414,D415
match-dir = (?!migrations)

[pytest]
DJANGO_SETTINGS_MODULE = test_settings
addopts = --cov edx_rbac --cov-report term-missing --cov-report xml
norecursedirs = .* docs requirements venvs

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
allowlist_externals =
    touch
    rm
commands =
    python -Wd -m pytest {posargs}

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups =
    doc
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
allowlist_externals =
    make
    rm
commands =
    doc8 --ignore-path docs/_build README.rst docs
    rm -f docs/edx_rbac.rst
    rm -f docs/modules.rst
    make -C docs clean
    make -C docs html
    python -m build --wheel
    twine check dist/*

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups =
    quality
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = .
allowlist_externals =
    make
    rm
    touch
commands =
    pylint src/edx_rbac tests test_utils manage.py
    pycodestyle src/edx_rbac tests manage.py
    pydocstyle src/edx_rbac tests manage.py
    isort --check-only --diff tests test_utils src/edx_rbac manage.py test_settings.py
    make selfcheck

[testenv:pii_check]
runner = uv-venv-lock-runner
dependency_groups =
    test
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
commands =
    code_annotations django_find_annotations --config_file .pii_annotations.yml --lint --report --coverage

[testenv:check_keywords]
runner = uv-venv-lock-runner
dependency_groups =
    test
allowlist_externals =
    make
commands =
    make check_keywords
